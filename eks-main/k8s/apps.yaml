apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    app.kubernetes.io/part-of: eks-main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: apps
  labels:
    app.kubernetes.io/name: service-a
    app.kubernetes.io/part-of: eks-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-a
        app.kubernetes.io/part-of: eks-main
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-a
          image: 362099375729.dkr.ecr.eu-central-1.amazonaws.com/kalman-eks-main/service-a:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: apps
  labels:
    app.kubernetes.io/name: service-a
    app.kubernetes.io/part-of: eks-main
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-a
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
